name: Tests et version Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  windows:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Automates-finis-Windows
          path: dist/Automates-finis-Windows.zip
      - name: Publier la version testée
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "windows-${{ github.run_number }}" dist/Automates-finis-Windows.zip
          --target "$env:GITHUB_SHA" --title "Automates finis — démonstration Windows"
          --notes "Extraire tout le ZIP, puis ouvrir Tester.bat. Python n’est pas nécessaire. Projet EFREI réalisé à trois ; voir le README pour le parcours d’essai."
          --latest
